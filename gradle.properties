org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Kotlin 编译守护进程默认只有 512 MiB，编译 Compose 项目会 OOM / 极慢
kotlin.daemon.jvmargs=-Xmx2g
# R8 混淆跑在独立 JVM 里，给足堆；标准 runner 共 16GB
android.r8.jvmArgs=-Xmx9g
# R8 并行度（默认 1），多核 runner 上更快
android.r8.maxWorkers=2
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# AGP 9 内置 Kotlin（已迁移，不再需要 kotlin-android 插件）
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# R8 full mode 更激进但内存与耗时翻倍，正式打包用标准 R8 即可（已开启混淆与资源裁剪）
# android.enableR8.fullMode=true

