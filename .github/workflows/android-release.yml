name: Android Release

# 推 tag（v1.0.0）时发布正式版；手动触发可自填版本号
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本名，如 1.0.0'
        required: true
        default: '1.0.0'
      versionCode:
        description: '版本号（递增整数）'
        required: true
        default: '1'
      publish:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 接受 Android SDK 许可
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager"; exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: 安装平台与构建工具
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          # 升级命令行工具，确保能识别 Android 17 的新版本号（android-37.0）
          "$SDKMANAGER" "cmdline-tools;latest" || true
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Android 17 的平台包名为 android-37.0（带小版本号）
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" || \
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" || true
          echo "--- 已安装的平台 ---"
          ls "$ANDROID_HOME/platforms" || true

      - name: 恢复签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/soda-release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/soda-release.jks" >> "$GITHUB_ENV"
            echo "签名密钥已恢复"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，将产出未签名 APK（仅供测试）"
          fi

      - name: 计算版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.versionName }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.versionCode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "code=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "code=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Release APK（R8 混淆 + 资源压缩 + AOT 优化）
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ || true
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: soda-music-${{ steps.version.outputs.name }}-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            苏打音乐 v${{ steps.version.outputs.name }}

            - 版本号：${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            - 已启用 R8 混淆与资源压缩
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
